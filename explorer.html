<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Anatomy Explorer</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
      body {
        margin: 0;
        display: flex;
        height: 100vh;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }

      #info-panel {
        width: 35%;
        padding: 25px;
        background: #ffffff;
        border-right: 2px solid #eee;
        overflow-y: auto;
      }

      #canvas-container {
        width: 65%;
        position: relative;
        background: #f0f0f0;
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      h2 {
        margin-top: 0;
        color: #c62828;
      }

      .controls {
        position: absolute;
        bottom: 20px;
        right: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .btn {
        width: 50px;
        height: 50px;
        border: none;
        border-radius: 50%;
        font-size: 22px;
        cursor: pointer;
        background: white;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
      }

      .btn:hover {
        background: #eee;
      }

      .view-toggle {
        width: auto;
        min-width: 70px;
        height: 40px;
        border-radius: 20px;
        font-size: 14px;
        font-weight: 600;
        padding: 0 14px;
      }

      .view-toggle.active {
        background: #c62828;
        color: #fff;
      }

      #info-panel {
        width: 35%;
        padding: 28px;
        background: #fdfdfd;
        border-right: 1px solid #eee;
        overflow-y: auto;
      }

      #organ-title {
        font-size: 22px;
        margin-bottom: 18px;
        color: #260202;
        font-weight: 700;
        font-family: Georgia, "Times New Roman", Times, serif;
      }

      .section-card {
        background: white;
        padding: 18px;
        border-radius: 14px;
        margin-bottom: 18px;
        box-shadow: 0 6px 14px rgba(0, 0, 0, 0.06);
        line-height: 1.7;
      }

      .section-card h3 {
        margin-top: 0;
        font-size: 18px;
        color: #222;
        font-family: Georgia, "Times New Roman", Times, serif;
        margin-bottom: 12px;
      }

      .fact-card {
        background: #fff8e1;
      }

      .fact-text {
        font-family:
          "Inter", system-ui, "Segoe UI", "Roboto", "Helvetica Neue", sans-serif;
        font-style: italic;
      }

      .quiz-card {
        background: #f1fff3;
      }

      .quiz-btn {
        padding: 10px 18px;
        border: none;
        background: #4caf50;
        color: white;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 10px;
        font-size: 15px;
      }

      .quiz-btn:hover {
        background: #43a047;
      }

      .answer-box {
        margin-top: 12px;
        padding: 12px;
        background: #e8f5e9;
        border-radius: 6px;
        font-weight: 400;
      }

      .fade-in {
        animation: fade 0.35s ease;
      }

      @keyframes fade {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      ul {
        padding-left: 20px;
      }

      li {
        margin-bottom: 8px;
      }
    </style>
  </head>

  <body>
    <div id="info-panel">
      <h2 id="organ-title">Human Heart</h2>
      <div id="part-description">Click any heart part to learn about it.</div>
    </div>

    <div id="canvas-container">
      <canvas id="glCanvas"></canvas>

      <div class="controls">
        <button
          class="btn view-toggle"
          id="view-3d-btn"
          onclick="setViewMode('3d')"
        >
          3D
        </button>
        <button
          class="btn view-toggle"
          id="view-2d-btn"
          onclick="setViewMode('2d')"
        >
          2D
        </button>
        <button class="btn view-toggle" onclick="adjustZoom(1.1)">+</button>
        <button class="btn view-toggle" onclick="adjustZoom(0.9)">−</button>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
